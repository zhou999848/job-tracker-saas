name: CI

on:
  push:
    branches: ["**"]      # 任意分支 push
  pull_request:           # 任意 PR
  workflow_dispatch:      # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven




      - name: Build & Test
        run: mvn -q -Dspring.profiles.active=test -DskipTests=false test

      - name: Upload Jacoco report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-site
          path: target/site/jacoco/

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/




      - name: Show surefire summary
        if: failure()
        run: |
          echo "==== FAILURES ===="
          if [ -d target/surefire-reports ]; then
            grep -R "<<< FAILURE" -n target/surefire-reports || true
            grep -R "Caused by" -n target/surefire-reports || true
          fi

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

