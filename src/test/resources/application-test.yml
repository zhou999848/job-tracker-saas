# src/test/resources/application-test.yml
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  sql:
    init:
      mode: always

security:
  jwt:
    enabled: false

file:
  s3:
    endpoint: http://localhost:9000
    region: us-east-1
    accessKey: minioadmin
    secretKey: minioadmin
    bucket: jobtracker
    pathStyle: true
    presignExpireSeconds: 300