<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>添加note</title>

</head>
<body>
<!-- login.html 中（大概率第 9 行） -->
<div th:replace="fragments/lang-switch :: langSwitch(${basePath}, ${redirect})"></div>


<h2>添加note</h2>
<form action="/uploadMulti" method="post" enctype="multipart/form-data">
    <!-- ✅ 必须：CSRF 隐藏字段 -->
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="text" name="jobId" placeholder="jobId"/>
    <input type="text" name="content" placeholder="笔记内容"/>
    <input type="file" name="files" multiple/>
    <button type="submit">提交</button>
</form>

<a href="/jobs/{jobId}/notes">返回列表</a>
<script src="/js/http.js" defer></script>
</body>
</html>
