<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      xmlns="http://www.w3.org/1999/html"
      th:lang="${#locale}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{page.addNote}">添加note</title>
</head>
<body>

<!-- 多语言切换（保持你的片段引入） -->
<div th:replace="~{fragments/lang-switch :: langSwitch}"></div>

<h2 id="form-title" th:text="#{page.addNote}">添加note</h2>

<form th:action="@{/uploadMulti}" method="post" enctype="multipart/form-data" aria-labelledby="form-title">
    <!-- ✅ CSRF -->
    <sec:csrfInput/>

    <!-- 必须：隐藏提交 jobId -->
    <input type="hidden" name="jobId" th:value="${jobId}"/>

    <!-- Content -->
    <label for="content" th:text="#{form.content}">笔记内容</label>
    <input id="content" type="text" name="content"
           th:placeholder="#{placeholder.content}" placeholder="笔记内容"/>

    <!-- Files -->
    <label for="files" th:text="#{form.files}">附件</label>
    <input id="files" type="file" name="files" multiple
           th:attr="aria-label=#{form.files}"/>

    <button type="submit" th:text="#{form.submit}">提交</button>
</form>

<p>
    <a th:href="@{/jobs/{jobId}/notes(jobId=${jobId})}"
       th:text="#{link.backNotes}">返回笔记列表</a>
</p>

<script src="/js/http.js" defer></script>
</body>
</html>
