<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Tenant</title>
</head>
<body>

<h2>Create Tenant</h2>

<form th:action="@{/system/tenants/create}" th:object="${form}" method="post">
    <label>Tenant Name:</label><br>
    <input type="text" th:field="*{name}" placeholder="Enter tenant name" required>
    <br><br>
    <button type="submit">Create</button>
</form>

<br>
<a th:href="@{/system/tenants}">Back to Tenant List</a>

</body>
</html>
