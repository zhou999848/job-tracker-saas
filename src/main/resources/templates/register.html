<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{page.register.title}">用户注册</title>
</head>
<body>

<div th:replace="~{fragments/lang-switch :: langSwitch}"></div>

<h2 th:text="#{page.register.heading}">注册新用户</h2>

<form th:action="@{/register}" method="post" th:object="${userDto}">

    <div>
        <label for="username" th:text="#{form.username}">用户名:</label>
        <input type="text" id="username" th:field="*{username}"
               placeholder="请输入用户名" th:placeholder="#{form.username.placeholder}" required/>
    </div>

    <div>
        <label for="password" th:text="#{form.password}">密码:</label>
        <input type="password" id="password" th:field="*{password}"
               placeholder="请输入密码" th:placeholder="#{form.password.placeholder}" required/>
    </div>

    <div>
        <label for="role" th:text="#{form.role}">角色:</label>
        <select id="role" th:field="*{role}">
            <option value="USER">USER</option>
            <option value="TENANT_ADMIN">TENANT_ADMIN</option>
            <option value="SYSTEM_ADMIN">SYSTEM_ADMIN</option>
        </select>
    </div>

    <button type="submit" th:text="#{form.submit.register}">注册</button>

    <div th:if="${ok}" th:text="${ok}" style="color: green"></div>

    <div th:if="${#fields.hasErrors('*')}" style="color: red">
        <p th:each="e : ${#fields.errors('*')}" th:text="${e}">错误</p>
    </div>
</form>

<hr/>

<a th:href="@{/tenants/{tenantId}/members(tenantId=${tenantId})}">
    返回成员列表
</a>

</body>
</html>
