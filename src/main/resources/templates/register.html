
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{page.register.title}">用户注册</title>
</head>
<body>

<!-- 多语言切换 -->
<!--<div th:replace="fragments/lang-switch :: langSwitch"></div>-->
<div th:replace="~{fragments/lang-switch :: langSwitch}"></div>

<h2 th:text="#{page.register.heading}">注册新用户</h2>

<form th:action="@{/register}" method="post" th:object="${userDto}">
    <!-- 如启用 CSRF，可解开任意一种写法 -->
    <!-- <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/> -->
    <!-- <sec:csrfInput/> -->

    <div>
        <label for="username" th:text="#{form.username}">用户名:</label>
        <input type="text" id="username" th:field="*{username}" required
               th:placeholder="#{form.username.placeholder}" placeholder="请输入用户名">
    </div>

    <div>
        <label for="password" th:text="#{form.password}">密码:</label>
        <input type="password" id="password" th:field="*{password}" required
               th:placeholder="#{form.password.placeholder}" placeholder="请输入密码">
    </div>

    <button type="submit" th:text="#{form.submit.register}">注册</button>
    <!-- 成功提示：若后端传纯文本保留原样；若传 key，前端可用 th:text="#{${ok}}" -->
    <div th:if="${ok}" th:text="${ok}" style="color: green"></div>

    <!-- 校验错误（内容通常已是人类可读字符串；如需 i18n，自定义 key 并在后端传 key 列表） -->
    <div th:if="${#fields.hasErrors('*')}" style="color: red">
        <p th:each="e : ${#fields.errors('*')}" th:text="${e}">错误</p>
    </div>
</form>

<a th:href="@{/login}" th:text="#{link.backLogin}">返回登录页面</a>



</body>
</html>
