<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:lang="${#locale}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{page.note}">note</title>
</head>
<body>
<!-- 多语言切换（保留你的片段引入；去除重复） -->
<div th:replace="~{fragments/lang-switch :: langSwitch}"></div>

<h2>
    <span th:text="#{note.list}">笔记列表</span>
    <span style="color:#666; font-size:14px;">
        （<span th:text="#{note.count(${totalNotes})}">共 0 条</span>）
    </span>
</h2>



<!-- 没有笔记 -->
<div th:if="${#lists.isEmpty(notes)}">
    <p th:text="#{note.empty}">没有找到任何笔记</p>
    <a th:href="@{/uploadMulti(jobId=${jobId})}" th:text="#{note.add}">添加笔记</a>
</div>

<!-- 有笔记 -->
<div th:if="${not #lists.isEmpty(notes)}">
    <a th:href="@{/uploadMulti(jobId=${jobId})}" th:text="#{note.addNew}">添加新的笔记</a>
    <table border="1">
        <thead>
        <tr>
            <th th:text="#{note.index}">序号</th>
            <th th:text="#{note.time}">时间</th>
            <th th:text="#{note.content}">笔记内容</th>
            <th th:text="#{note.attachments}">附件下载</th>
            <th th:text="#{note.actions}">操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="note, stat : ${notes}">
            <td th:text="${pageSize * currentPage + stat.index + 1}">1</td>
            <td th:text="${note.createdAt}">时间</td>
            <td th:text="${note.content}">笔记内容</td>

            <td>
                <div th:if="${note.filePaths != null and !#lists.isEmpty(note.filePaths)}">
                    <ul>
                        <li th:each="p : ${note.filePaths}">
                          <span th:with="
                            slash=${p != null ? p.lastIndexOf('/') : -1},
                            bslash=${p != null ? p.lastIndexOf('\\') : -1},
                            idx=${slash > bslash ? slash : bslash},
                            name=${(idx >= 0) ? #strings.substring(p, idx + 1) : p}">
                            <a th:href="@{/api/notes/download(filename=${name})}"
                               th:text="${name}"
                               th:attr="aria-label=#{note.attachment}"
                               target="_blank">附件</a>
                          </span>
                        </li>
                    </ul>
                </div>
                <span th:if="${note.filePaths == null or #lists.isEmpty(note.filePaths)}"
                      th:text="#{note.noAttachment}">无</span>
            </td>

            <td>
                <a th:href="@{/notes/edit/{id}(id=${note.id},jobId=${jobId})}" th:text="#{action.edit}">编辑</a>
                <span> | </span>
                <button type="button" class="btn-delete" th:attr="data-id=${note.id}"
                        th:text="#{note.delete}">删除note</button>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- 分页 -->
    <div style="margin-top: 10px;">
        <span th:if="${currentPage > 0}">
            <a th:href="@{/jobs/{jobId}/notes(jobId=${jobId}, page=${currentPage - 1})}"
               th:text="#{pagination.prev}">上一页</a>
        </span>

        <span>
          <span th:text="#{pagination.page}">第</span>
          <span th:text="${currentPage + 1}">1</span>
          <span th:text="#{pagination.pageSuffix}">页</span>
        </span>

        <span>
          <span th:text="#{pagination.total}">共</span>
          <span th:text="${totalPages}">1</span>
          <span th:text="#{pagination.pageSuffix}">页</span>
        </span>

        <span th:if="${currentPage + 1 < totalPages}">
            <a th:href="@{/jobs/{jobId}/notes(jobId=${jobId}, page=${currentPage + 1})}"
               th:text="#{pagination.next}">下一页</a>
        </span>
    </div>
</div>

<!-- 返回按钮 -->
<p>
    <a th:href="@{/jobs}" th:text="#{return.jobList}">返回职位列表</a>
</p>

<!-- JS 文案国际化 -->
<script th:inline="javascript">
    /*<![CDATA[*/
    const I18N = {
        noNoteId: /*[[#{alert.noNoteId}]]*/ 'Note ID not found',
        confirmDeleteNote: /*[[#{alert.confirmDeleteNote}]]*/ 'Are you sure you want to delete this note?',
        deleteSuccess: /*[[#{alert.deleteSuccess}]]*/ 'Deleted successfully',
        deleteForbidden: /*[[#{alert.deleteForbidden}]]*/ 'No permission to delete (or CSRF failed)',
        deleteFailed: /*[[#{alert.deleteFailed}]]*/ 'Delete failed',
        networkError: /*[[#{alert.networkError}]]*/ 'Network/Script error'
    };
    /*]]>*/
</script>

<script>
    document.addEventListener('click', async (e) => {
        const btn = e.target.closest('.btn-delete');
        if (!btn) return;

        const noteId = btn.dataset.id;
        if (!noteId) { alert(I18N.noNoteId); return; }
        if (!confirm(I18N.confirmDeleteNote)) return;

        const url = `/api/notes/${encodeURIComponent(noteId)}`;
        const headers = {};
        if (typeof CSRF_TOKEN !== "undefined" && typeof CSRF_HEADER !== "undefined") {
            headers[CSRF_HEADER] = CSRF_TOKEN;
        }

        try {
            const res = await fetch(url, { method: 'DELETE', headers, credentials: 'same-origin' });

            if (res.status === 204 || res.status === 200) {
                btn.closest('tr')?.remove();
                alert('✅ ' + I18N.deleteSuccess);
                return;
            }
            if (res.status === 401) {
                const target = location.pathname + location.search;
                location.href = '/login?redirect=' + encodeURIComponent(target);
                return;
            }
            if (res.status === 403) {
                alert(I18N.deleteForbidden);
                return;
            }
            alert(`❌ ${I18N.deleteFailed}: HTTP ${res.status}`);
        } catch (err) {
            alert(`❌ ${I18N.networkError}: ${err?.message || err}`);
        }
    });
</script>

<script src="/js/http.js" defer></script>
</body>
</html>
