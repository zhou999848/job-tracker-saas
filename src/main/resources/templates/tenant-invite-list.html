<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>邀请记录</title>
</head>

<body>

<h2>邀请记录列表</h2>

<table border="1" cellpadding="6">
    <thead>
    <tr>
        <th>Email</th>
        <th>角色</th>
        <th>过期时间</th>
        <th>状态</th>
        <th>邀请链接</th>
        <th>操作</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="i : ${invites}">
        <td th:text="${i.email}"></td>
        <td th:text="${i.role}"></td>
        <td th:text="${#dates.format(i.expiresAt, 'yyyy-MM-dd HH:mm')}"></td>

        <!-- 状态逻辑 -->
        <td>
            <span th:if="${i.used}">已使用</span>
            <span th:if="${!i.used and i.expiresAt.isBefore(T(java.time.Instant).now())}">
                已过期
            </span>
            <span th:if="${!i.used and i.expiresAt.isAfter(T(java.time.Instant).now())}">
                未使用
            </span>
        </td>

            <!-- 邀请链接 -->
        <td>
            <input type="text"
                   th:value="@{'/invite/accept?token=' + ${i.inviteToken}}"
                   readonly
                   style="width:260px;">
        </td>

        <td>
            <button class="btn-delete-invite"
                    th:attr="data-invite-id=${i.id}, data-tenant-id=${tenantId}">
                删除
            </button>
        </td>
    </tr>
    </tbody>
</table>

<br>
<a th:href="@{/tenants/{id}/members(id=${tenantId})}">返回成员列表</a>

<script>
    const I18N_INVITE = {
        confirmDelete: "确认删除此邀请记录？",
        deleteOk: "删除成功",
        deleteFail: "删除失败",
        unauthorized: "未登录或会话过期",
        forbidden: "没有权限",
        netOrScriptErr: "网络/脚本错误"
    };
</script>

<script>
    document.addEventListener('click', async (e) => {
        const btn = e.target.closest('.btn-delete-invite');
        if (!btn) return;

        const inviteId = btn.dataset.inviteId;
        const tenantId = btn.dataset.tenantId;

        // 1. 确认删除
        if (!confirm(I18N_INVITE.confirmDelete)) return;

        const url = `/api/admin/tenants/${tenantId}/invites/${inviteId}`;

        try {
            const res = await fetch(url, {
                method: 'DELETE',
                credentials: 'same-origin',
                headers: {
                    "Accept": "application/json"
                }
            });

            // 401 未认证
            if (res.status === 401) {
                alert(I18N_INVITE.unauthorized);
                return;
            }

            // 403 无权限
            if (res.status === 403) {
                const msg = await res.text().catch(() => '');
                alert(I18N_INVITE.forbidden + "\n" + msg);
                return;
            }

            // DELETE 成功（一般是 204 No Content）
            if (res.ok) {
                btn.closest('tr')?.remove();
                alert('✅ ' + I18N_INVITE.deleteOk);
                return;
            }

            // 其他失败情况
            const text = await res.text().catch(() => '');
            alert(`❌ ${I18N_INVITE.deleteFail}: HTTP ${res.status}\n${text}`);

        } catch (err) {
            alert(`❌ ${I18N_INVITE.netOrScriptErr}: ${err?.message || err}`);
        }
    });
</script>

</body>
</html>
