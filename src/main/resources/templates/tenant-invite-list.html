<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{invite.list.title}">邀请记录</title>
</head>

<body>
<div th:replace="~{fragments/lang-switch :: langSwitch}"></div>

<h2 th:text="#{invite.list.heading}">邀请记录列表</h2>

<table border="1" cellpadding="6">
    <thead>
    <tr>
        <th th:text="#{invite.email}">Email</th>
        <th th:text="#{invite.role}">角色</th>
        <th th:text="#{invite.expireAt}">过期时间</th>
        <th th:text="#{invite.status}">状态</th>
        <th th:text="#{invite.link}">邀请链接</th>
        <th th:text="#{invite.actions}">操作</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="i : ${invites}">
        <td th:text="${i.email}"></td>
        <td th:text="${i.role}"></td>
        <td th:text="${#dates.format(i.expiresAt, 'yyyy-MM-dd HH:mm')}"></td>

        <td>
            <span th:if="${i.used}" th:text="#{invite.status.used}">已使用</span>
            <span th:if="${!i.used and i.expiresAt.isBefore(T(java.time.Instant).now())}"
                  th:text="#{invite.status.expired}">
                已过期
            </span>
            <span th:if="${!i.used and i.expiresAt.isAfter(T(java.time.Instant).now())}"
                  th:text="#{invite.status.unused}">
                未使用
            </span>
        </td>

        <td>
            <input type="text"
                   th:value="@{'/invite/accept?token=' + ${i.inviteToken}}"
                   readonly style="width:260px;">
        </td>

        <td>
            <button class="btn-delete-invite"
                    th:attr="data-invite-id=${i.id}, data-tenant-id=${tenantId}"
                    th:text="#{invite.delete}">
                删除
            </button>
        </td>
    </tr>
    </tbody>
</table>

<br>

<a th:href="@{/tenants/{id}/members(id=${tenantId})}"
   th:text="#{link.backToMembers}">
    返回成员列表
</a>

<script th:inline="javascript">
    const I18N_INVITE = {
        confirmDelete: /*[[#{alert.invite.confirmDelete}]]*/ "确认删除此邀请记录？",
        deleteOk: /*[[#{alert.deleteOk}]]*/ "删除成功",
        deleteFail: /*[[#{alert.deleteFail}]]*/ "删除失败",
        unauthorized: /*[[#{alert.unauthorized}]]*/ "未登录或会话过期",
        forbidden: /*[[#{alert.forbidden}]]*/ "没有权限",
        netOrScriptErr: /*[[#{alert.netOrScriptErr}]]*/ "网络/脚本错误"
    };
</script>

<script>
    document.addEventListener('click', async (e) => {
        const btn = e.target.closest('.btn-delete-invite');
        if (!btn) return;

        const inviteId = btn.dataset.inviteId;
        const tenantId = btn.dataset.tenantId;

        if (!confirm(I18N_INVITE.confirmDelete)) return;

        const url = `/api/admin/tenants/${tenantId}/invites/${inviteId}`;

        try {
            const res = await fetch(url, {
                method: "DELETE",
                credentials: "same-origin"
            });

            if (res.ok) {
                btn.closest("tr")?.remove();
                alert(I18N_INVITE.deleteOk);
                return;
            }

            if (res.status === 401) return alert(I18N_INVITE.unauthorized);
            if (res.status === 403) return alert(I18N_INVITE.forbidden);

            alert(I18N_INVITE.deleteFail);
        } catch (err) {
            alert(I18N_INVITE.netOrScriptErr);
        }
    });
</script>

</body>
</html>
