<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8">
    <title>租户管理</title>
</head>
<body>

<!-- 租户信息修改 -->
<h2>租户信息</h2>
<form th:action="@{/api/tenants/{tid}/rename(tid=${tenantId})}" method="post">
    名称:
    <input type="text" name="name" th:value="${tenantName}" required />
    <button type="submit">更新</button>
</form>

<hr/>

<!-- 邀请成员表单 -->
<h2>邀请成员</h2>
<form th:action="@{/api/admin/tenants/{tid}/invites(tid=${tenantId})}" method="post">
    邮箱:
    <input type="email" name="email" required />
    角色:
    <select name="role">
        <option value="USER">USER</option>
        <option value="TENANT_ADMIN">TENANT_ADMIN</option>
    </select>
    <button type="submit">发送邀请</button>
</form>

<hr/>

<!-- 成员列表 -->
<h2>成员列表</h2>
<table border="1" cellpadding="5" cellspacing="0">
    <thead>
    <tr>
        <th>用户名</th>
        <th>邮箱</th>
        <th>角色</th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="m : ${members}">
        <td th:text="${m.username}">alice</td>
        <td th:text="${m.email}">alice@example.com</td>
        <td th:text="${m.role}">USER</td>
        <td>
            <!-- 删除 -->
            <form th:action="@{/api/admin/tenants/{tid}/members/{uid}(tid=${tenantId},uid=${m.userId})}"
                  method="post" style="display:inline;">
                <input type="hidden" name="_method" value="delete"/>
                <button type="submit">删除</button>
            </form>
            <!-- 角色变更示例（可选） -->
            <form th:action="@{/api/tenants/{tid}/members/{uid}/role(tid=${tenantId},uid=${m.userId})}"
                  method="post" style="display:inline;">
                <input type="hidden" name="_method" value="patch"/>
                <select name="role">
                    <option value="USER">USER</option>
                    <option value="TENANT_ADMIN">TENANT_ADMIN</option>
                </select>
                <button type="submit">修改角色</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
