<!DOCTYPE html>
    <html xmlns:th="http://www.thymeleaf.org"  xmlns:sec="https://www.thymeleaf.org/extras/spring-security">e.html (片段) -->
<head>
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
</head>

<h2>个人资料</h2>
<form th:action="@{/profile/update}" method="post">
    <sec:csrfInput/>
    <label>昵称</label>
    <input type="text" name="displayName" th:value="${me.displayName}" required maxlength="50"/>
    <label>邮箱</label>
    <input type="email" name="email" th:value="${me.email}" maxlength="120"/>
    <button type="submit">保存</button>
</form>

<h2>修改密码</h2>
<form th:action="@{/profile/change-password}" method="post">
    <sec:csrfInput/>
    <label>当前密码</label>
    <input type="password" name="currentPassword" required/>
    <label>新密码（至少8位，含大小写和数字）</label>
    <input type="password" name="newPassword" required/>
    <button type="submit">修改密码</button>
</form>

</html>
