<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{tenant.system.title}">租户列表</title>
</head>

<body>
<div th:replace="~{fragments/lang-switch :: langSwitch}"></div>
<style>
    .table-like { border-collapse: collapse; width: 100%; font-size: 14px; color: #333; }
    .table-like th, .table-like td { border: 1px solid #888; padding: 6px 8px; text-align: center; }
    .table-like th { font-weight: bold; background: #f9f9f9; }
    .action-link { color: #0066cc; text-decoration: none; cursor: pointer; }
    .action-link:hover { text-decoration: underline; }
    .btn-delete-member { border: none; background: none; color: #0066cc; cursor: pointer; padding: 0; font-size: 14px; }
    .btn-delete-member:hover { text-decoration: underline; }
</style>
<h2>
    <span th:text="#{tenant.system.heading}">租户列表</span>
    <span style="color:#666; font-size:14px;">
        （<span th:text="#{tenant.system.total(${totalTenants})}">共 0 个</span>）
    </span>
</h2>

<form th:object="${searchForm}" th:action="@{/system/tenants}" method="get">
    <input type="text" th:field="*{keyword}" th:placeholder="#{tenant.search.placeholder}">
    <button type="submit" th:text="#{search.button}">搜索</button>
    <a th:href="@{/system/tenants}" th:text="#{tenant.search.reset}" style="margin-left:10px;">返回全部</a>
</form>

<a th:href="@{/system/tenants/create}" th:text="#{tenant.create}">Create New Tenant</a>

<table class="table-like">
    <thead>
    <tr>
        <th th:text="#{tenant.name}">Name</th>
        <th th:text="#{tenant.status}">Status</th>
        <th th:text="#{tenant.members.count}">Members</th>
        <th th:text="#{table.actions}">操作</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="t : ${tenants}">
        <td th:text="${t.name}"></td>

        <td>
            <span th:class="${t.status.toString() == 'ACTIVE'} ? 'tag-active' : 'tag-suspended'"
                  th:text="#{${'tenant.state.' + t.status.toString().toLowerCase()}}">
            </span>
        </td>

        <td th:text="${t.memberCount}"></td>

        <td>
            <a class="action-link"
               th:href="@{|/tenants/${t.id}/rename|}"
               th:text="#{tenant.rename}">
                重命名
            </a>
            |

            <a class="action-link"
               href="javascript:void(0)"
               th:if="${t.status.toString() == 'ACTIVE'}"
               th:data-id="${t.id}"
               onclick="suspendTenant(this.dataset.id)"
               th:text="#{tenant.suspend}">
                封禁
            </a>

            <a class="action-link"
               href="javascript:void(0)"
               th:if="${t.status.toString() == 'SUSPENDED'}"
               th:data-id="${t.id}"
               onclick="resumeTenant(this.dataset.id)"
               th:text="#{tenant.resume}">
                解封
            </a>
        </td>

    </tr>
    </tbody>
</table>

<div class="pagination">
    <a th:if="${page.number > 0}"
       th:href="@{/system/tenants(page=${page.number - 1}, size=${page.size}, keyword=${searchForm.keyword})}"
       th:text="#{pagination.prev}">
        上一页
    </a>

    <span>
        <span th:text="#{pagination.page}">第</span>
        <span th:text="${page.number + 1}"></span>
        <span th:text="#{pagination.pageSuffix}">页</span> /
        <span th:text="#{pagination.total}">共</span>
        <span th:text="${page.totalPages}"></span>
        <span th:text="#{pagination.pageSuffix}">页</span>
    </span>

    <a th:if="${page.number < page.totalPages - 1}"
       th:href="@{/system/tenants(page=${page.number + 1}, size=${page.size}, keyword=${searchForm.keyword})}"
       th:text="#{pagination.next}">
        下一页
    </a>
</div>

<a th:href="@{/jobs}" style="margin-left:10px;" th:text="#{link.backToJobs}">
    返回职位页面
</a>

<!-- JS 文案国际化 -->
<script th:inline="javascript">
    /*<![CDATA[*/
    const I18N = {
        confirmSuspend: /*[[#{alert.confirmSuspend}]]*/ 'Are you sure to suspend this tenant?',
        confirmResume:  /*[[#{alert.confirmResume}]]*/  'Are you sure to resume this tenant?',
        suspendSuccess: /*[[#{alert.suspendSuccess}]]*/ 'Tenant suspended successfully',
        resumeSuccess:  /*[[#{alert.resumeSuccess}]]*/  'Tenant resumed successfully',
        actionFailed:   /*[[#{alert.actionFailed}]]*/   'Action failed',
        networkError:   /*[[#{alert.networkError}]]*/   'Network/Script error'
    };
    /*]]>*/
</script>
<script>
    async function suspendTenant(id) {
        if (!confirm(I18N.confirmSuspend)) return;

        try {
            const res = await fetch(`/api/tenants/${encodeURIComponent(id)}/suspend`, {
                method: "PATCH",
                credentials: "same-origin"
            });

            if (res.ok) {
                alert('✅ ' + I18N.suspendSuccess);
                location.reload();
                return;
            }

            alert(`❌ ${I18N.actionFailed}: HTTP ${res.status}`);
        } catch (err) {
            alert(`❌ ${I18N.networkError}: ${err?.message || err}`);
        }
    }

    async function resumeTenant(id) {
        if (!confirm(I18N.confirmResume)) return;

        try {
            const res = await fetch(`/api/tenants/${encodeURIComponent(id)}/resume`, {
                method: "PATCH",
                credentials: "same-origin"
            });

            if (res.ok) {
                alert('✅ ' + I18N.resumeSuccess);
                location.reload();
                return;
            }

            alert(`❌ ${I18N.actionFailed}: HTTP ${res.status}`);
        } catch (err) {
            alert(`❌ ${I18N.networkError}: ${err?.message || err}`);
        }
    }
</script>



</body>
</html>
