
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale}">
<head>
    <meta charset="UTF-8">
    <title th:text="#{page.editJob.title}">编辑职位</title>
</head>
<body>
<div th:replace="~{fragments/lang-switch :: langSwitch}"></div>

<h2 th:text="#{page.editJob.heading}">编辑职位</h2>

<form th:action="@{'/jobs/edit/' + ${jobId}}" method="post" th:object="${form}">


    <label for="company" th:text="#{form.company}">公司：</label>
    <input id="company" type="text" th:field="*{company}" required><br>

    <label for="position" th:text="#{form.position}">职位：</label>
    <input id="position" type="text" th:field="*{position}" required><br>

    <label for="status" th:text="#{form.status}">状态：</label>
    <select id="status" th:field="*{status}">
        <option value="applied"   th:text="#{status.applied}">applied</option>
        <option value="interview" th:text="#{status.interview}">interview</option>
        <option value="offer"     th:text="#{status.offer}">offer</option>
        <option value="rejected"  th:text="#{status.rejected}">rejected</option>
    </select><br>

    <label for="appliedDate" th:text="#{form.appliedDate}">申请日期：</label>
    <input id="appliedDate" type="date" th:field="*{appliedDate}"><br>

    <button type="submit" th:text="#{form.save}">保存</button>
    <a th:href="@{/jobs}" th:text="#{link.backJobs}">返回职位列表</a>

    <!-- 成功提示：若后端传纯文本保留原样；若传 key，前端可用 th:text="#{${ok}}" -->
    <div th:if="${ok}" th:text="${ok}" style="color: green"></div>

    <!-- 校验错误（内容通常已是人类可读字符串；如需 i18n，自定义 key 并在后端传 key 列表） -->
    <div th:if="${#fields.hasErrors('*')}" style="color: red">
        <p th:each="e : ${#fields.errors('*')}" th:text="${e}">错误</p>
    </div>
</form>
</body>
</html>
