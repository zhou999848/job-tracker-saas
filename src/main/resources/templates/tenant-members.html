<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title th:text="#{tenant.members.title}">Tenant Members</title>
</head>

<body>
<div th:replace="~{fragments/lang-switch :: langSwitch}"></div>

<style>
    .table-like { border-collapse: collapse; width: 100%; font-size: 14px; color: #333; }
    .table-like th, .table-like td { border: 1px solid #888; padding: 6px 8px; text-align: center; }
    .table-like th { font-weight: bold; background: #f9f9f9; }
    .action-link { color: #0066cc; text-decoration: none; cursor: pointer; }
    .action-link:hover { text-decoration: underline; }
    .btn-delete-member { border: none; background: none; color: #0066cc; cursor: pointer; padding: 0; font-size: 14px; }
    .btn-delete-member:hover { text-decoration: underline; }
</style>

<div sec:authorize="isAuthenticated()">
    <span>
        <span th:text="#{tenant.name.label}">租户名：</span>
        <b th:text="${tenantName}">默认</b>
    </span>
</div>

<h2>
    <span th:text="#{tenant.members.heading}">租户成员列表</span>
    <span style="color:#666; font-size:14px;">
        （<span th:text="#{tenant.members.total(${totalMembers})}">共 0 人</span>）
    </span>

    <form th:action="@{|/tenants/${tenantId}/invite|}"
          method="get"
          style="display:inline-block; margin-left:8px;">
        <button type="submit" th:text="#{tenant.members.invite}">邀请新成员</button>
    </form>
</h2>
<form th:action="@{/tenant/members/search}" method="post" aria-label="search form">
    <input type="text"
           name="keyword"
           th:value="${keyword}"
           th:placeholder="#{member.search.placeholder}"
           placeholder="成员关键字"/>

    <input type="hidden" name="page" th:value="${page}"/>
    <input type="hidden" name="size" th:value="${size}"/>

    <button type="submit" th:text="#{search.button}">搜索</button>
</form>
<a th:href="@{/register}" th:text="#{tenant.members.registerNew}">注册新成员</a><br>

<table class="table-like">
    <thead>
    <tr>
        <th th:text="#{table.index}">序号</th>
        <th th:text="#{table.username}">Username</th>
        <th th:text="#{table.role}">Role</th>
        <th th:text="#{table.actions}">操作</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="m, stat : ${members}">
        <td th:text="${pageSize * currentPage + stat.index + 1}"></td>
        <td th:text="${m.username}"></td>
        <td th:text="${m.role}"></td>

        <td>
            <a class="action-link"
               th:href="@{|/tenants/members/${m.userId}/jobs|}"
               th:text="#{tenant.members.viewJobs}">
                求職記録
            </a>
            |
            <a class="action-link"
               th:href="@{|/tenants/${tenantId}/members/${m.userId}/role|}"
               th:text="#{tenant.members.changeRole}">
                变更角色
            </a>
            |
            <button class="btn-delete-member"
                    th:text="#{tenant.members.delete}"
                    th:attr="data-user-id=${m.userId}, data-tenant-id=${tenantId}">
                删除
            </button>
        </td>
    </tr>
    </tbody>
</table>

<div class="pagination" style="margin-top: 15px;">
    <span th:if="${currentPage > 0}">
        <a th:href="@{|/tenants/${tenantId}/members?page=${currentPage - 1}|}"
           th:text="#{pagination.prev}">上一页</a>
    </span>

    &nbsp;

    <span>
        <span th:text="#{pagination.page}">第</span>
        <span th:text="${currentPage + 1}">1</span>
        <span th:text="#{pagination.pageSuffix}">页</span>
    </span>

    &nbsp;

    <span>
        <span th:text="#{pagination.total}">共</span>
        <span th:text="${totalPages}">1</span>
        <span th:text="#{pagination.pageSuffix}">页</span>
    </span>

    &nbsp;

    <span th:if="${currentPage + 1 < totalPages}">
        <a th:href="@{|/tenants/${tenantId}/members?page=${currentPage + 1}|}"
           th:text="#{pagination.next}">下一页</a>
    </span>
</div>

<a th:href="@{/jobs}" th:text="#{link.backToJobs}">返回职位列表</a>

<script src="/js/api.js"></script>

<script th:inline="javascript">
    const I18N = {
        notFoundId: /*[[#{alert.notFoundId}]]*/ 'ID 不存在',
        confirmDelete: /*[[#{alert.confirmDelete}]]*/ '确定删除吗？',
        unauthorized: /*[[#{alert.unauthorized}]]*/ '未登录或会话过期',
        forbidden: /*[[#{alert.forbidden}]]*/ '没有权限',
        deleteFail: /*[[#{alert.deleteFail}]]*/ '删除失败',
        deleteOk: /*[[#{alert.deleteOk}]]*/ '删除成功',
        netOrScriptErr: /*[[#{alert.netOrScriptErr}]]*/ '网络/脚本错误'
    };
</script>

<script>
    document.addEventListener('click', async (e) => {
        const btn = e.target.closest('.btn-delete-member');
        if (!btn) return;

        const userId = btn.dataset.userId;
        const tenantId = btn.dataset.tenantId;

        if (!userId || !tenantId) {
            alert(I18N.notFoundId);
            return;
        }
        if (!confirm(I18N.confirmDelete)) return;

        const url = `/api/admin/tenants/${tenantId}/members/${userId}`;

        try {
            const res = await fetch(url, { method: 'DELETE', credentials:'same-origin' });

            if (res.status === 401) return alert(I18N.unauthorized);
            if (res.status === 403) return alert(I18N.forbidden);
            if (!res.ok) return alert(I18N.deleteFail);

            btn.closest('tr')?.remove();
            alert(I18N.deleteOk);

        } catch (err) {
            alert(I18N.netOrScriptErr);
        }
    });
</script>

<script src="/js/http.js" defer></script>

</body>
</html>
