<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>职位列表</title>

    <!-- 如果启用了 Spring Security 的 CSRF（默认开启），需要把 token 注入给 JS -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>

<body>
<h2>已申请职位列表</h2>

<!-- 没有职位时显示 -->
<p th:if="${#lists.isEmpty(jobs)}">没有找到任何职位 (No jobs found)</p>

<!-- 职位列表表格 -->
<table border="1">
    <thead>
    <tr>
        <th>序号</th>
        <th>公司</th>
        <th>职位</th>
        <th>状态</th>
        <th>申请日期</th>
        <th>操作</th>
        <th>id</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="job, stat : ${jobs}" th:attr="data-row-id=${job.id}">
        <td th:text="${pageSize * currentPage + stat.index + 1}">序号</td>
        <td th:text="${job.company}">公司</td>
        <td th:text="${job.position}">职位</td>
        <td th:text="${job.status}">状态</td>
        <td th:text="${job.appliedDate}">申请日期</td>
        <td>
            <a th:href="@{/jobs/edit/{id}(id=${job.id})}">编辑</a>
            <a th:href="@{/jobs/{id}/notes(id=${job.id})}">查看笔记</a>
            |

            <button type="button" class="btn-delete" th:attr="data-id=${job.id}">删除</button>
        </td>
        <td th:text="${job.id}">测试ID</td>
    </tr>
    </tbody>
</table>

<!-- 分页按钮 -->
<div>
  <span th:if="${currentPage > 0}">
    <a th:href="@{/jobs(page=${currentPage - 1})}">上一页</a>
  </span>

    <span>第 <span th:text="${currentPage + 1}">1</span> 页</span>
    <span>共 <span th:text="${totalPages}">1</span> 页</span>

    <span th:if="${currentPage + 1 < totalPages}">
    <a th:href="@{/jobs(page=${currentPage + 1})}">下一页</a>
  </span>
</div>

<a href="/logout">登出</a>
<a th:href="@{/jobs}">返回列表</a>

<script>
    // CSRF（如果启用了 Spring Security 的 CSRF）
    const CSRF_TOKEN  = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
    const CSRF_HEADER = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');

    // 页面加载完成后，给所有删除按钮绑定事件
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.btn-delete').forEach(btn => {
            btn.addEventListener('click', () => {
                const id = btn.dataset.id;   // 从 data-id 取 UUID
                deleteJob(id, btn);
            });
        });
    });

    async function deleteJob(jobId, btn) {
        if (!confirm("确定要删除这个职位吗？")) return;

        const url = `/api/jobs/${jobId}`;
        const headers = {};
        if (CSRF_TOKEN && CSRF_HEADER) headers[CSRF_HEADER] = CSRF_TOKEN;

        try {
            const res = await fetch(url, { method: 'DELETE', headers });
            const raw = await res.text().catch(() => "");

            if (!res.ok) {
                alert(`❌ 删除失败：HTTP ${res.status}\nURL=${url}\n\n${raw}`);
                return;
            }

            // 成功：移除当前行
            btn.closest('tr')?.remove();
            alert("✅ 删除成功");
        } catch (e) {
            console.error(e);
            alert(`❌ 网络/脚本错误：${e?.message || e}`);
        }
    }
</script>


</body>
</html>
