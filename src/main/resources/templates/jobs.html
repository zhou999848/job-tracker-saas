<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>职位列表</title>
</head>
<body>
<h2>已申请职位列表</h2>

<table border="1">
    <tr>
        <th>公司</th>
        <th>职位</th>
        <th>状态</th>
        <th>申请日期</th>
    </tr>

    <tr th:each="job : ${jobs}">
        <td th:text="${job.company}">公司名</td>
        <td th:text="${job.position}">职位名</td>
        <td th:text="${job.status}">状态</td>
        <td th:text="${job.appliedDate}">申请日期</td>
    </tr>
</table>

<a href="/logout" >登出</a>
<a href="@{/notes/{id}(id=${job.id})}">note</a>
</body>
</html>
