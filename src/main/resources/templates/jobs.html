<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>职位列表</title>

    <!-- 若将来开启 CSRF，再恢复下面两行；当前无状态 JWT，先禁用或加条件 -->
    <!-- <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}"/> -->
</head>

<body>
<h2>已申请职位列表</h2>
<!-- 已登录可见 -->
<div sec:authorize="isAuthenticated()">
    こんにちは, <b sec:authentication="name">user</b>
    <form th:action="@{/logout}" method="post" style="display:inline">
        <button type="submit">退出</button>
    </form>
</div>

<!-- 未登录可见 -->
<div sec:authorize="isAnonymous()">
    <a th:href="@{/login}">请登录</a>
</div>





<p th:if="${#lists.isEmpty(jobs)}">没有找到任何职位 (No jobs found)</p>

<table border="1">
    <thead>
    <tr>
        <th>序号</th><th>公司</th><th>职位</th><th>状态</th><th>申请日期</th><th>操作</th><th>id</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="job, stat : ${jobs}" th:attr="data-row-id=${job.id}">
        <td th:text="${pageSize * currentPage + stat.index + 1}">序号</td>
        <td th:text="${job.company}">公司</td>
        <td th:text="${job.position}">职位</td>
        <td th:text="${job.status}">状态</td>
        <td th:text="${job.appliedDate}">申请日期</td>
        <td>
            <a th:href="@{/jobs/edit/{id}(id=${job.id})}">编辑</a>
            <a th:href="@{/jobs/{id}/notes(id=${job.id})}">查看笔记</a> |
            <button type="button" class="btn-delete" th:attr="data-id=${job.id}">删除</button>
        </td>
        <td th:text="${job.id}">测试ID</td>
    </tr>
    </tbody>
</table>

<div>
  <span th:if="${currentPage > 0}">
    <a th:href="@{/jobs(page=${currentPage - 1})}">上一页</a>
  </span>
    <span>第 <span th:text="${currentPage + 1}">1</span> 页</span>
    <span>共 <span th:text="${totalPages}">1</span> 页</span>
    <span th:if="${currentPage + 1 < totalPages}">
    <a th:href="@{/jobs(page=${currentPage + 1})}">下一页</a>
  </span>
</div>




<script>
    // 事件委托：整个文档捕获点击，只处理 .btn-delete
    document.addEventListener('click', async (e) => {
        const btn = e.target.closest('.btn-delete');
        if (!btn) return;

        const jobId = btn.dataset.id;
        console.log('[Delete] click detected, jobId=', jobId);

        if (!jobId) {
            alert('找不到该职位ID');
            return;
        }
        if (!confirm('确定要删除这个职位吗？')) return;

        const url = `/api/jobs/${jobId}`;
        console.log('[Delete] sending DELETE', url);

        try {
            const res = await fetch(url, {
                method: 'DELETE',
                // 同域请求默认会带 Cookie；显式声明更直观
                credentials: 'same-origin'
            });

            const text = await res.text().catch(() => '');

            console.log('[Delete] response', res.status, text);

            if (!res.ok) {
                alert(`❌ 删除失败：HTTP ${res.status}\n${text}`);
                return;
            }

            // 成功：移除行
            btn.closest('tr')?.remove();
            alert('✅ 删除成功');
        } catch (err) {
            console.error(err);
            alert(`❌ 网络/脚本错误：${err?.message || err}`);
        }
    });

    // 可选：页面加载确认一下按钮是否存在
    document.addEventListener('DOMContentLoaded', () => {
        const count = document.querySelectorAll('.btn-delete').length;
        console.log('[Init] delete buttons =', count);
    });
</script>

</body>
</html>
