<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{tenant.invite.title}">邀请成员</title>
</head>

<body>
<div th:replace="~{fragments/lang-switch :: langSwitch}"></div>

<h2 th:text="#{tenant.invite.heading}">邀请成员</h2>

<div th:if="${ok}" style="color: green; font-weight: bold;">
    <p th:text="${ok}"></p>
</div>

<form th:action="@{|/tenants/${tenantId}/invite|}"
      method="post"
      th:object="${inviteForm}">

    <label th:text="#{form.email}">Email</label>:
    <input type="email" th:field="*{email}" required>
    <br><br>

    <label th:text="#{form.role}">Role</label>:
    <select th:field="*{role}">
        <option value="USER" th:text="#{role.user}">USER</option>
        <option value="TENANT_ADMIN" th:text="#{role.tenantAdmin}">TENANT_ADMIN</option>
    </select>
    <br><br>

    <label th:text="#{form.expireDays}">有效期（天）</label>:
    <input type="number" th:field="*{daysToExpire}" min="1" max="365">
    <br><br>

    <button type="submit" th:text="#{tenant.invite.send}">发送邀请</button>
</form>

<a th:href="@{/tenants/{tenantId}/members(tenantId=${tenantId})}"
   th:text="#{link.backToMembers}">
    返回成员列表
</a>

</body>
</html>
