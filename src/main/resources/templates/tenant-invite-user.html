<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tenant Members</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f3f3f3; }
        .pagination { margin-top: 20px; }
    </style>
</head>
<body>
<h2>邀请成员</h2>

<form th:action="@{|/tenants/${tenantId}/invite|}" method="post"
      th:object="${inviteForm}">

    <label>Email:
        <input type="email" th:field="*{email}" required>
    </label>
    <br><br>

    <label>Role:
        <select th:field="*{role}">
            <option value="USER">USER</option>
            <option value="TENANT_ADMIN">TENANT_ADMIN</option>
        </select>
    </label>
    <br><br>

    <label>有效期（天）:
        <input type="number" th:field="*{daysToExpire}" min="1" max="365" value="7">
    </label>
    <br><br>

    <button type="submit">发送邀请</button>

</form>
<a th:href="@{/tenants/{tenantId}/members(tenantId=${tenantId})}" th:text="#{addJob.link.back}">Return to user List</a>

</body>
</html>
