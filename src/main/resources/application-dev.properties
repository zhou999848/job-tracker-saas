# =======================
# Server
# =======================
server.port=8080

# =======================
# Datasource (Local Dev)
# =======================
spring.datasource.url=jdbc:postgresql://localhost:5432/jobtracker
spring.datasource.username=jobuser
spring.datasource.password=jobpass

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 2-6/3-3/3-4/6-4

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB



# =======================
# JWT ??//6-7
# =======================

# ???? 32 ???256 bit?

# dev only
jwt.secret=${JWT_SECRET:dev-secret-please-change-32chars-min}


# Access Token ?????????? 900 = 15 ??
jwt.access-seconds=900

# Refresh Token ?????????? 604800 = 7 ?
jwt.refresh-seconds=604800

# ???????????? 60 ?
jwt.clockskew-seconds=60



server.error.include-stacktrace=always

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet=DEBUG
logging.level.org.thymeleaf=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE



#i18n
spring.messages.basename=messages,ValidationMessages
#spring.messages.encoding=ISO-8859-1
spring.messages.encoding=UTF-8

spring.messages.fallback-to-system-locale=false
spring.messages.use-code-as-default-message=true
spring.thymeleaf.cache=false

app.bootstrap.enabled=false
app.bootstrap.token=d8f3e8f3-7f1a-4a3b-9c3a-2f5d1a9f1c22



# MinIO 端点（已更新为你新提供的地址）
file.s3.endpoint=${FILE_S3_ENDPOINT:http://localhost:9000}
# 随便填一个（MinIO 会忽略区域校验）
file.s3.accessKey=${MINIO_ACCESS_KEY:minioadmin}
file.s3.secretKey=${MINIO_SECRET_KEY:minioadmin}


file.s3.region=us-east-1

file.s3.bucket=jobtracker
# 临时链接有效期，5 分钟
file.s3.presignExpireSeconds=300
# 必须：MinIO 常用路径风格访问
file.s3.pathStyle=true





